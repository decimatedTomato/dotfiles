# Vim modes
set-window-option -g mode-keys vi

# Copy paste
set -s set-clipboard off
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "xsel -b"
bind-key -n -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xsel -b"

# Rebind leader key
# unbind C-b
# set-option -g prefix C-a
# bind-key C-a send-prefix

set -g default-terminal "screen-256color"

# Random stuff
# set -g mouse
# set -g base-index 1
# set -g pane-base-index 1
# set -s escape-time 20

# Source local config
if-shell -b '[ -e ~/.tmux.conf_local]' { source-file .tmux.conf_local }

